# Toda clave, URL o parámetro se lee de variables de entorno; los valores por defecto son solo para desarrollo.
server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: business-api
  datasource:
    # BD PROPIA de la API (llamadas, eventos, resultados, validaciones, promesas, rellamadas).
    # En desarrollo H2 en memoria; con el perfil sqlserver las mismas variables apuntan a una BD propia en SQL Server.
    # Nunca apuntes esta URL a CNTSEC: CNTSEC se consulta con la fuente de datos `cntsec` de abajo.
    url: ${DB_URL:jdbc:h2:mem:cobranza;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Solo para H2; GuardaEsquema aborta el arranque si hay create-drop/update contra otra BD.
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}

# Core de cobranza CobraTwo (BD CNTSEC). Fuente de datos de SOLO LECTURA salvo el registro de gestión.
# Desarrollo: servidor FNTSRVD4. Producción: perfil `prod` (application-prod.yml), que solo cambia el servidor.
cntsec:
  datasource:
    host: ${CNTSEC_HOST:FNTSRVD4}
    url: ${CNTSEC_URL:jdbc:sqlserver://${cntsec.datasource.host}:1433;databaseName=CNTSEC;encrypt=true;trustServerCertificate=true}
    username: ${CNTSEC_USER:}
    password: ${CNTSEC_PASSWORD:}
    # Script opcional para una CNTSEC simulada en H2 (pruebas y desarrollo sin red): classpath:cntsec-h2.sql
    init-script: ${CNTSEC_INIT_SCRIPT:}
    max-pool-size: ${CNTSEC_POOL:5}
  # Ids del catálogo COBTG01 (TM_GENERALCB) que usan las consultas
  catalogo:
    deuda-vigente: 417          # TIP_SIT_VIG
    negociacion-vigente: 554    # TIP_STNEG_VIG
    cliente-fallecido: 423      # TIP_SIT_FA
  # La única escritura en CNTSEC es la tabla propia del agente AGENTEIATT01 (specs/sql/AGENTEIATT01.sql).

cobranza:
  # Clave compartida con el agente (cámbiala; en producción usa variable de entorno)
  api-key: ${COBRANZA_API_KEY:dev-key-cambiar}
  validacion:
    # Intentos máximos de verificación de identidad por llamada
    max-intentos: ${COBRANZA_MAX_INTENTOS:3}
    # Cantidad de dígitos iniciales del documento que el cliente debe decir para validarse
    digitos-documento: ${COBRANZA_DIGITOS_DOCUMENTO:4}
  politica:
    # Descuento máximo según antigüedad de la mora (cartera castigada)
    tramos:
      - { dias-mora-desde: 0,    descuento-maximo: 10 }
      - { dias-mora-desde: 361,  descuento-maximo: 40 }
      - { dias-mora-desde: 721,  descuento-maximo: 60 }
      - { dias-mora-desde: 1081, descuento-maximo: 70 }
    # Puntos porcentuales que se restan al descuento según número de cuotas
    reduccion-por-cuotas:
      1: 0
      3: 10
      6: 20
      12: 30
    cuota-minima: ${COBRANZA_CUOTA_MINIMA:50.00}
    dias-max-primer-pago: ${COBRANZA_DIAS_MAX_PRIMER_PAGO:15}
    vigencia-oferta-dias: ${COBRANZA_VIGENCIA_OFERTA_DIAS:5}
