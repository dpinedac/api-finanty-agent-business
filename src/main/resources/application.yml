# Toda clave, URL o parámetro se lee de variables de entorno; los valores por defecto son solo para desarrollo.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: business-api
  datasource:
    # En desarrollo H2 en memoria; con el perfil sqlserver las mismas variables apuntan a SQL Server
    url: ${DB_URL:jdbc:h2:mem:cobranza;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

cobranza:
  # Clave compartida con el agente (cámbiala; en producción usa variable de entorno)
  api-key: ${COBRANZA_API_KEY:dev-key-cambiar}
  validacion:
    # Intentos máximos de verificación de identidad por llamada
    max-intentos: ${COBRANZA_MAX_INTENTOS:3}
  politica:
    # Descuento máximo según antigüedad de la mora (cartera castigada)
    tramos:
      - { dias-mora-desde: 0,    descuento-maximo: 10 }
      - { dias-mora-desde: 361,  descuento-maximo: 40 }
      - { dias-mora-desde: 721,  descuento-maximo: 60 }
      - { dias-mora-desde: 1081, descuento-maximo: 70 }
    # Puntos porcentuales que se restan al descuento según número de cuotas
    reduccion-por-cuotas:
      1: 0
      3: 10
      6: 20
      12: 30
    cuota-minima: ${COBRANZA_CUOTA_MINIMA:50.00}
    dias-max-primer-pago: ${COBRANZA_DIAS_MAX_PRIMER_PAGO:15}
    vigencia-oferta-dias: ${COBRANZA_VIGENCIA_OFERTA_DIAS:5}
