# Perfil para la BD PROPIA de la API en SQL Server (no CNTSEC): java -jar app.jar --spring.profiles.active=sqlserver
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # El esquema propio lo crea un script de BD; la API nunca lo modifica.
      ddl-auto: none
  sql:
    init:
      mode: never
