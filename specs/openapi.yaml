openapi: 3.1.0
info:
  title: business-api · API de negocio de cobranza
  version: 0.2.0
  summary: Reglas de negocio y único escritor en base de datos del agente conversacional de cobranza.
  description: |
    API consumida por **agent-voice** (perfiles validador, seguimiento y negociador) y por **back-discador**
    (lectura de rellamadas). Todas las rutas bajo `/api/` exigen la cabecera `X-API-Key`.

    Reglas que viven aquí y no en el prompt del agente:
    - Sin identidad validada no se entregan datos de deuda.
    - Los montos de ofertas y promesas se calculan en el servidor.
    - La fecha del primer pago de una promesa debe estar entre hoy y el plazo máximo de la política.

    Correlación: `callId` es el `uuid_llamada` de back-discador y el mismo valor que el dialplan entrega a AudioSocket.
    Con él se enlazan la llamada, sus eventos, la validación de teléfono, las promesas, las rellamadas y el resultado.

    Los cambios de contrato son aditivos: ningún cuerpo existente cambia de forma.
  contact:
    name: Finanty · Sistemas
servers:
  - url: http://localhost:8080
    description: Desarrollo local (H2 en memoria con datos sintéticos)
  - url: http://business-api:8080
    description: Red interna de docker compose

security:
  - ApiKey: []

tags:
  - name: Clientes
    description: Datos mínimos para saludar y verificación de identidad.
  - name: Deudas
    description: Deudas del cliente. Solo después de validar identidad.
  - name: Ofertas
    description: Cálculo de descuentos y cuotas según política.
  - name: Promesas
    description: Promesas de pago; el monto se recalcula en el servidor.
  - name: Rellamadas
    description: Rellamadas agendadas por el agente y leídas por el discador.
  - name: Llamadas
    description: "Ciclo de vida de una llamada con agente IA: inicio, eventos, resultado y consulta."
  - name: Teléfonos
    description: Resultado de la validación del teléfono marcado.
  - name: Configuración del agente
    description: Depósito versionado de prompts, guion y configuración por ámbito (global o perfil), consumido por agent-voice y su consola.

paths:
  /api/v1/clientes/{documento}:
    get:
      tags: [Clientes]
      operationId: obtenerClienteResumen
      summary: Documento, nombre y si se le puede llamar
      description: |
        Precarga para el discador y el saludo, leída de CNTSEC (COBTM08). No revela datos de deuda.
        `llamable` es false (con `motivoNoLlamable`) si el cliente está fallecido, no tiene deuda vigente
        o tiene una negociación vigente: en esos casos no se origina la llamada.
      parameters:
        - $ref: '#/components/parameters/Documento'
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResumen'
              examples:
                llamable:
                  value: { documento: '45879632', nombre: Carlos Ramírez Soto, nombres: Carlos, apellidos: Ramírez Soto, llamable: true, motivoNoLlamable: null }
                fallecido:
                  value: { documento: '33445566', nombre: Rosa Vega Luna, nombres: Rosa, apellidos: Vega Luna, llamable: false, motivoNoLlamable: FALLECIDO }
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/v1/clientes/verificar:
    post:
      tags: [Clientes]
      operationId: verificarIdentidad
      summary: Verifica la identidad con la confirmación del titular y los primeros dígitos del documento
      description: |
        Valida contra CNTSEC. Requiere `confirmaIdentidad: true` y `digitosDocumento` igual a los primeros
        dígitos del documento (`COBRANZA_DIGITOS_DOCUMENTO`, 4 por defecto). Máximo de intentos por `callId`
        (o por documento si no se envía), configurable con `COBRANZA_MAX_INTENTOS`. Superado el máximo responde
        `verificado: false` con `intentosRestantes: 0`. Sin ningún dato de control responde `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificarRequest'
            examples:
              porDigitos:
                value:
                  documento: '45879632'
                  confirmaIdentidad: true
                  digitosDocumento: '4587'
                  callId: 7c6a1e8e-3a0d-4f0b-9b61-2d1b8f0c9e11
              porAnioNacimiento:
                description: Compatibilidad con el contrato anterior.
                value:
                  documento: '45879632'
                  anioNacimiento: 1985
                  callId: 7c6a1e8e-3a0d-4f0b-9b61-2d1b8f0c9e11
      responses:
        '200':
          description: Resultado de la verificación (coincida o no).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificarResponse'
              examples:
                validado:
                  value: { verificado: true, nombre: Carlos, intentosRestantes: 3, mensaje: Identidad validada. }
                noCoincide:
                  value: { verificado: false, nombre: null, intentosRestantes: 2, mensaje: Los datos no coinciden. }
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'

  /api/v1/clientes/{documento}/campanas:
    get:
      tags: [Clientes]
      operationId: listarCampanasCliente
      summary: Campaña de CobraTwo de la prioridad pedida (por defecto 1) para cada deuda vigente
      description: |
        Lee de CNTSEC la asignación deuda–campaña (COBTT15), la campaña (COBTM16) y su descuento (COBTM14).
        Devuelve, por cada deuda **vigente** del cliente, las campañas asignadas con la `prioridad` indicada
        que estén activas: asignación y campaña en estado activo (3). **El estado es lo único que define la
        vigencia**; las fechas de la campaña son informativas y una campaña activa con fecha de fin pasada se entrega.

        Una deuda suele tener **una campaña de prioridad 1 por tipo** (`COBRANZA_GENERAL` y `COBRANZA_DIGITAL`):
        usa `tipo` para quedarte con una sola. Sin campañas que cumplan, la lista llega vacía.

        Es dato de deuda: el agente solo debe invocarlo después de una verificación exitosa.

        `oferta` trae el **monto preaprobado** y el **porcentaje de descuento** ya calculados en el servidor con
        las mismas definiciones que CobraTwo (`TM_ClienteDeuda.getTM15NDEUPREAPR`): los pagos válidos (COBTT03,
        convertidos a la moneda de la deuda con el tipo de cambio del día) se descuentan de la deuda, cubren
        primero los intereses y solo el exceso reduce el capital; sobre esos saldos se evalúa la fórmula de la
        campaña. Si la fórmula no se puede evaluar, `montoPreaprobado` llega en null: nunca se inventa un monto.

        Las campañas con factor 1.00 ("sin campaña": se cobra la deuda total) no tienen descuento que comunicar:
        `porcentajeDescuento` llega en null y solo vale `montoPreaprobado`.

        Es la **única fuente** de deuda y oferta para el agente negociador; la promesa se registra con
        `POST /api/v1/promesas/campana`.
      parameters:
        - $ref: '#/components/parameters/Documento'
        - name: prioridad
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
          description: Prioridad de la campaña dentro de la deuda (`TT15NPRIO`); 1 es la principal.
        - name: tipo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TipoCampana'
          description: Si se envía, solo campañas de ese tipo.
      responses:
        '200':
          description: Campañas encontradas (lista vacía si ninguna deuda vigente tiene una).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampanaDeuda'
              example:
                - deudaId: 101
                  operacion: 90000001
                  entidad: Banco Ejemplo
                  cartera: Cartera 2019
                  prioridad: 1
                  campanaId: 1136
                  nombre: C_OFF_01_45%
                  descripcion: Cancelación con 45% de descuento
                  tipo: COBRANZA_DIGITAL
                  vigenteDesde: '2026-11-01'
                  vigenteHasta: '2026-11-30'
                  descuento: { descuentoId: 954, tipo: FORMULA, cuotasMaximas: 1, formula: '(fSaldoCapital*(1-0.45))', factor: 0.45, montoFijo: null }
                  oferta: { moneda: SOLES, deudaActual: 2950.00, capitalActual: 2950.00, interesTotal: 1650.00, montoPreaprobado: 1622.50, porcentajeDescuento: 45.00, cuotas: 1, cuotaMensual: 1622.50 }
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/v1/deudas/{documento}:
    get:
      tags: [Deudas]
      operationId: listarDeudas
      summary: Deudas del cliente
      description: El agente solo debe invocarlo después de una verificación exitosa.
      parameters:
        - $ref: '#/components/parameters/Documento'
      responses:
        '200':
          description: Lista de deudas (vacía si el cliente no tiene o no existe).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deuda'
              example:
                - deudaId: 1
                  producto: Tarjeta de crédito
                  entidadOrigen: Banco Andino
                  saldoTotal: 4850.00
                  diasMora: 820
                  estado: VIGENTE
        '401':
          $ref: '#/components/responses/NoAutorizado'

  /api/v1/ofertas/calcular:
    post:
      tags: [Ofertas]
      operationId: calcularOferta
      summary: Descuento y cuotas según política
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalcularOfertaRequest'
            example: { documento: '45879632', deudaId: 1, cuotas: 3 }
      responses:
        '200':
          description: Oferta calculada en el servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oferta'
              example:
                deudaId: 1
                saldoTotal: 4850.00
                cuotas: 3
                porcentajeDescuento: 50
                montoConDescuento: 2425.00
                montoCuota: 808.33
                vigenteHasta: '2026-10-19'
        '400':
          description: Número de cuotas no permitido o cuota menor al mínimo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: 'Número de cuotas no permitido. Opciones: [1, 3, 6, 12]' }
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: La deuda no pertenece al cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La deuda no está VIGENTE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/promesas:
    post:
      tags: [Promesas]
      operationId: registrarPromesa
      summary: Registra una promesa de pago
      description: El monto se recalcula con la política vigente y la deuda pasa a `CON_PROMESA`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromesaRequest'
            example:
              documento: '45879632'
              deudaId: 1
              cuotas: 3
              fechaPrimerPago: '2026-10-20'
              callId: 7c6a1e8e-3a0d-4f0b-9b61-2d1b8f0c9e11
      responses:
        '200':
          description: Promesa registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromesaResponse'
              example:
                promesaId: 1
                cuotas: 3
                montoTotal: 2425.00
                montoCuota: 808.33
                fechaPrimerPago: '2026-10-20'
                mensaje: Promesa de pago registrada.
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: La deuda no pertenece al cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: La deuda no está VIGENTE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/rellamadas:
    post:
      tags: [Rellamadas]
      operationId: agendarRellamada
      summary: Agenda una rellamada
      description: La `fechaHora` debe ser futura. Queda en estado `PENDIENTE` hasta que el discador la reprograme.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RellamadaRequest'
            example:
              documento: '45879632'
              fechaHora: '2026-10-15T15:00:00'
              motivo: El cliente pidió que lo llamen el jueves a las 3 pm.
              callId: 7c6a1e8e-3a0d-4f0b-9b61-2d1b8f0c9e11
      responses:
        '200':
          description: Rellamada agendada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RellamadaAgendadaResponse'
              example: { rellamadaId: 1, fechaHora: '2026-10-15T15:00', mensaje: Rellamada agendada. }
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
    get:
      tags: [Rellamadas]
      operationId: listarRellamadas
      summary: Rellamadas para que el discador reprograme
      description: |
        Lista las rellamadas agendadas por el agente, ordenadas por `fechaHora` ascendente.
        - `pendientes=true` devuelve solo las de estado `PENDIENTE` (aún no tomadas por el discador).
        - `desde` y `hasta` acotan por `fechaHora` (ambos inclusivos, en hora local del servidor).
      parameters:
        - name: pendientes
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Solo rellamadas en estado `PENDIENTE`.
        - name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: '2026-10-15T00:00:00'
          description: Límite inferior de `fechaHora` (inclusive).
        - name: hasta
          in: query
          required: false
          schema:
            type: string
            format: date-time
          example: '2026-10-15T23:59:59'
          description: Límite superior de `fechaHora` (inclusive).
      responses:
        '200':
          description: Rellamadas que cumplen los filtros (vacío si ninguna).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rellamada'
              example:
                - rellamadaId: 1
                  documento: '45879632'
                  fechaHora: '2026-10-15T15:00:00'
                  motivo: El cliente pidió que lo llamen el jueves a las 3 pm.
                  callId: 7c6a1e8e-3a0d-4f0b-9b61-2d1b8f0c9e11
                  estado: PENDIENTE
                  creadaEn: '2026-10-14T10:32:11'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'

  /api/v1/llamadas:
    post:
      tags: [Llamadas]
      operationId: iniciarLlamada
      summary: Registra el inicio de una llamada con agente IA
      description: |
        Se invoca al iniciar la sesión del agente, antes del saludo. `callId` es el `uuid_llamada` del discador.
        `guionHash` identifica la versión del guion de campaña que interpretó el agente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarLlamadaRequest'
            example:
              callId: 7c6a1e8e-3a0d-4f0b-9b61-2d1b8f0c9e11
              documento: '45879632'
              telefono: '51987654321'
              perfil: validador
              campana: VALIDACION-OCT-2026
              guionHash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      responses:
        '201':
          description: Llamada registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlamadaIniciadaResponse'
              example:
                llamadaId: 1
                callId: 7c6a1e8e-3a0d-4f0b-9b61-2d1b8f0c9e11
                inicio: '2026-10-14T10:30:00'
                mensaje: Llamada registrada.
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '409':
          description: Ya existe una llamada con ese `callId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: Ya existe una llamada con ese callId }

  /api/v1/llamadas/{callId}:
    get:
      tags: [Llamadas]
      operationId: obtenerLlamada
      summary: Llamada con su resultado y sus eventos
      description: |
        Devuelve la llamada registrada con `POST /api/v1/llamadas`, el último resultado registrado
        (`null` si aún no cerró) y los eventos de herramientas en orden cronológico.
      parameters:
        - $ref: '#/components/parameters/CallId'
      responses:
        '200':
          description: Llamada encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlamadaDetalle'
              example:
                llamadaId: 1
                callId: 7c6a1e8e-3a0d-4f0b-9b61-2d1b8f0c9e11
                documento: '45879632'
                telefono: '51987654321'
                perfil: validador
                campana: VALIDACION-OCT-2026
                guionHash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                inicio: '2026-10-14T10:30:00'
                fin: '2026-10-14T10:31:20'
                resultado:
                  resultadoId: 1
                  tipificacion: CONTACTO_VALIDADO
                  resumen: El cliente confirmó su identidad y el número.
                  guionHash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                  resumenEstructurado: { identidadValidada: true, telefonoCorrecto: true }
                  transcripcion: "Agente: Buenas tardes...\nCliente: Sí, soy yo."
                  registradoEn: '2026-10-14T10:31:20'
                eventos:
                  - eventoId: 1
                    herramienta: verificar_identidad
                    argumentos: { documento: '45879632', anioNacimiento: 1985 }
                    respuesta: { verificado: true, nombre: Carlos }
                    timestamp: '2026-10-14T10:30:25'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/v1/llamadas/{callId}/eventos:
    post:
      tags: [Llamadas]
      operationId: registrarEventoLlamada
      summary: Registra una herramienta ejecutada durante la llamada
      description: |
        Cada herramienta que el agente invoca queda registrada con sus argumentos y su respuesta en JSON.
        `timestamp` es opcional; si no viene se usa la hora del servidor. La llamada debe existir.
      parameters:
        - $ref: '#/components/parameters/CallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoLlamadaRequest'
            example:
              herramienta: verificar_identidad
              argumentos: { documento: '45879632', anioNacimiento: 1985 }
              respuesta: { verificado: true, nombre: Carlos, intentosRestantes: 3 }
              timestamp: '2026-10-14T10:30:25'
      responses:
        '201':
          description: Evento registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoRegistradoResponse'
              example: { eventoId: 1, mensaje: Evento registrado. }
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /api/v1/llamadas/{callId}/resultado:
    post:
      tags: [Llamadas]
      operationId: registrarResultadoLlamada
      summary: Tipificación final de la llamada
      description: |
        Cuerpo original: `documento`, `tipificacion` y `resumen`. Campos aditivos opcionales: `guionHash`,
        `transcripcion` (texto largo) y `resumenEstructurado` (objeto JSON libre).
        Si existe la llamada registrada con `POST /api/v1/llamadas`, se marca su fecha de fin.
        No exige que la llamada exista (compatibilidad con clientes previos).
      parameters:
        - $ref: '#/components/parameters/CallId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultadoLlamadaRequest'
            examples:
              cuerpoOriginal:
                summary: Cuerpo original (sigue siendo válido)
                value:
                  documento: '45879632'
                  tipificacion: RELLAMADA
                  resumen: El cliente pidió que lo llamen el jueves a las 3 pm.
              cuerpoAmpliado:
                summary: Cuerpo ampliado del validador
                value:
                  documento: '45879632'
                  tipificacion: CONTACTO_VALIDADO
                  resumen: El cliente confirmó su identidad y el número.
                  guionHash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                  transcripcion: "Agente: Buenas tardes, le saluda Lucía de Finanty...\nCliente: Sí, soy yo."
                  resumenEstructurado:
                    identidadValidada: true
                    telefonoCorrecto: true
                    duracionSeg: 58
      responses:
        '200':
          description: Resultado registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoRegistradoResponse'
              example: { resultadoId: 1, mensaje: Resultado registrado. }
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'

  /api/v1/telefonos/validacion:
    post:
      tags: [Teléfonos]
      operationId: registrarValidacionTelefono
      summary: Registra el resultado de la llamada de validación en CNTSEC
      description: |
        Lo envía el perfil validador al cerrar la llamada. Guarda en la tabla propia del agente
        `AGENTEIATT01` de CNTSEC: cliente, teléfono, fecha en que contestó, fecha en que colgó, duración,
        resumen, si es o no el cliente y fecha de registro. No escribe en las tablas de CobraTwo.
        `resultado` usa el subconjunto de tipificaciones propio de la validación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacionTelefonoRequest'
            example:
              documento: '45879632'
              telefono: '51987654321'
              resultado: CONTACTO_VALIDADO
              callId: 7c6a1e8e-3a0d-4f0b-9b61-2d1b8f0c9e11
              inicioLlamada: '2026-10-29T10:15:00'
              finLlamada: '2026-10-29T10:17:30'
              resumen: El titular confirmó su identidad con los primeros dígitos del DNI.
      responses:
        '201':
          description: Validación registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionRegistradaResponse'
              example: { validacionId: 1, resultado: CONTACTO_VALIDADO, mensaje: Validación registrada., esCliente: true, duracionSegundos: 150 }
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '409':
          description: Ya existe una validación con ese `callId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/configuracion-agente:
    get:
      tags: [Configuración del agente]
      operationId: listarAmbitosConfiguracion
      summary: Ámbitos con configuración publicada o en borrador
      description: |
        Un ámbito es `global` o el nombre de un perfil del agente (`validador`, `seguimiento`, `negociador` o los que
        se creen). Devuelve, por ámbito, la versión vigente (la de mayor número, `null` si aún no se publicó),
        si hay borrador y la fecha de publicación. Vacío si no hay nada configurado.
      responses:
        '200':
          description: Ámbitos conocidos, ordenados alfabéticamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmbitoConfiguracion'
              example:
                - { ambito: global, versionVigente: 3, hayBorrador: false, publicadoEn: '2026-10-30T18:02:11' }
                - { ambito: negociador, versionVigente: null, hayBorrador: true, publicadoEn: null }
                - { ambito: validador, versionVigente: 7, hayBorrador: true, publicadoEn: '2026-10-31T09:40:00' }
        '401':
          $ref: '#/components/responses/NoAutorizado'

  /api/v1/configuracion-agente/{ambito}:
    get:
      tags: [Configuración del agente]
      operationId: obtenerConfiguracionPublicada
      summary: Configuración publicada de un ámbito
      description: |
        La versión vigente del ámbito, con todos sus archivos. Es lo que agent-voice carga al arrancar o al
        recargar un perfil. Si el ámbito no tiene ninguna versión responde 404 y agent-voice lo siembra
        desde sus archivos con `publicar`.
      parameters:
        - $ref: '#/components/parameters/Ambito'
      responses:
        '200':
          description: Versión vigente con sus archivos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionConfiguracion'
              example:
                ambito: validador
                numero: 7
                autor: dpineda
                comentario: Ajuste del saludo y segundo intento de dígitos.
                fecha: '2026-10-31T09:40:00'
                archivos:
                  prompt.md: "Eres Lucía, asesora de Finanty...\n"
                  guion.json: "{\"saludo\":\"Buenos días, ¿hablo con {nombre}?\"}"
                  config.yaml: "llm:\n  modelo: gpt-4.1-mini\n"
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El ámbito no tiene ninguna versión publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: El ámbito no tiene configuración publicada }

  /api/v1/configuracion-agente/{ambito}/publicar:
    post:
      tags: [Configuración del agente]
      operationId: publicarConfiguracion
      summary: Publica una versión nueva del ámbito
      description: |
        Crea la versión `n+1` (inmutable) con los archivos enviados y elimina el borrador del ámbito si existía.
        Los archivos reemplazan por completo a los de la versión anterior: lo que no venga, no estará en la nueva.
        Nombres permitidos: `prompt.md`, `guion.json`, `config.yaml`, `global.yaml`. Contenido texto UTF-8 de hasta 256 KB por archivo.
      parameters:
        - $ref: '#/components/parameters/Ambito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicarConfiguracionRequest'
            example:
              archivos:
                prompt.md: "Eres Lucía, asesora de Finanty...\n"
                guion.json: "{\"saludo\":\"Buenos días, ¿hablo con {nombre}?\"}"
                config.yaml: "llm:\n  modelo: gpt-4.1-mini\n"
              autor: dpineda
              comentario: Ajuste del saludo y segundo intento de dígitos.
      responses:
        '201':
          description: Versión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionPublicadaResponse'
              example: { ambito: validador, numero: 8, fecha: '2026-10-31T10:05:42' }
        '400':
          description: Ámbito inválido, `archivos` vacío, nombre de archivo no permitido o contenido demasiado grande.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: 'Nombre de archivo no permitido: notas.txt. Permitidos: prompt.md, guion.json, config.yaml, global.yaml' }
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '409':
          description: |
            Publicación concurrente: otra publicación del mismo ámbito tomó el número `n+1` al mismo tiempo
            (lo detecta la restricción única `(ambito, numero)`). No se creó nada; reintentar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: 'Otra publicación del ámbito ocurrió al mismo tiempo; reintenta' }

  /api/v1/configuracion-agente/{ambito}/borrador:
    get:
      tags: [Configuración del agente]
      operationId: obtenerBorradorConfiguracion
      summary: Borrador del ámbito
      description: A lo sumo hay un borrador por ámbito. Es el trabajo en curso de la consola, aún no publicado.
      parameters:
        - $ref: '#/components/parameters/Ambito'
      responses:
        '200':
          description: Borrador con sus archivos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorradorConfiguracion'
              example:
                ambito: validador
                autor: dpineda
                comentario: Probando un saludo más corto.
                fecha: '2026-10-31T10:20:00'
                archivos:
                  prompt.md: "Eres Lucía...\n"
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El ámbito no tiene borrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: El ámbito no tiene borrador }
    put:
      tags: [Configuración del agente]
      operationId: guardarBorradorConfiguracion
      summary: Crea o reemplaza el borrador del ámbito
      description: |
        Guarda el borrador completo (los archivos enviados reemplazan a los anteriores). Para "restaurar" una
        versión antigua el cliente la lee con `versiones/{numero}` y la guarda aquí como borrador.
        Mismas reglas de nombres y tamaño que `publicar`.
      parameters:
        - $ref: '#/components/parameters/Ambito'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardarBorradorRequest'
            example:
              archivos:
                prompt.md: "Eres Lucía...\n"
              autor: dpineda
              comentario: Probando un saludo más corto.
      responses:
        '200':
          description: Borrador guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorradorGuardadoResponse'
              example: { ambito: validador, fecha: '2026-10-31T10:20:00' }
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
    delete:
      tags: [Configuración del agente]
      operationId: eliminarBorradorConfiguracion
      summary: Elimina el borrador del ámbito
      description: Idempotente; responde 204 aunque no hubiera borrador.
      parameters:
        - $ref: '#/components/parameters/Ambito'
      responses:
        '204':
          description: Borrador eliminado o inexistente.
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'

  /api/v1/configuracion-agente/{ambito}/versiones:
    get:
      tags: [Configuración del agente]
      operationId: listarVersionesConfiguracion
      summary: Historial de versiones del ámbito
      description: Metadatos de cada versión publicada, sin archivos, de la más reciente a la más antigua. Vacío si no hay ninguna.
      parameters:
        - $ref: '#/components/parameters/Ambito'
      responses:
        '200':
          description: Versiones ordenadas por `numero` descendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionConfiguracionResumen'
              example:
                - { numero: 8, autor: dpineda, comentario: Ajuste del saludo., fecha: '2026-10-31T10:05:42' }
                - { numero: 7, autor: dpineda, comentario: Segundo intento de dígitos., fecha: '2026-10-31T09:40:00' }
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'

  /api/v1/configuracion-agente/{ambito}/versiones/{numero}:
    get:
      tags: [Configuración del agente]
      operationId: obtenerVersionConfiguracion
      summary: Una versión concreta con sus archivos
      parameters:
        - $ref: '#/components/parameters/Ambito'
        - $ref: '#/components/parameters/NumeroVersion'
      responses:
        '200':
          description: Versión con sus archivos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionConfiguracion'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: No existe esa versión en el ámbito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: { error: Versión no encontrada }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clave compartida entre servicios. En el servidor se configura con la variable `COBRANZA_API_KEY`.

  parameters:
    Documento:
      name: documento
      in: path
      required: true
      schema:
        type: string
        maxLength: 15
      example: '45879632'
      description: Documento de identidad del cliente.
    CallId:
      name: callId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
      example: 7c6a1e8e-3a0d-4f0b-9b61-2d1b8f0c9e11
      description: Identificador de la llamada (`uuid_llamada` del discador).
    Ambito:
      name: ambito
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{0,31}$'
      example: validador
      description: "`global` o el nombre de un perfil del agente. Minúsculas, dígitos, guion y guion bajo; hasta 32 caracteres."
    NumeroVersion:
      name: numero
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      example: 7
      description: Número de versión dentro del ámbito (1..n).

  responses:
    NoAutorizado:
      description: Falta la cabecera `X-API-Key` o no coincide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: API key inválida }
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: Cliente no encontrado }
    DatosInvalidos:
      description: El cuerpo o los parámetros no pasan la validación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example: { error: 'documento: must not be blank' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Mensaje legible; el agente lo explica al cliente cuando corresponde.

    Tipificacion:
      type: string
      description: |
        Catálogo de tipificaciones del agente. Las ocho primeras existían desde la fase 1;
        `CONTACTO_VALIDADO`, `NO_EXISTE`, `INFORMADO` y `PROMESA_SIMPLE` se agregaron para el validador y el seguimiento.
        El mapeo a las tipificaciones del discador (CONTACTO, AGENDAMIENTO, CONTACTO_INDIRECTO, NO_CONTACTO) vive en back-discador.
      enum:
        - PROMESA_PAGO
        - RELLAMADA
        - RECHAZO
        - TERCERO
        - NUMERO_EQUIVOCADO
        - TRANSFERIDO
        - SIN_VALIDAR
        - OTRO
        - CONTACTO_VALIDADO
        - NO_EXISTE
        - INFORMADO
        - PROMESA_SIMPLE

    ResultadoValidacionTelefono:
      type: string
      description: Subconjunto de tipificaciones que describe a quién pertenece el teléfono marcado.
      enum:
        - CONTACTO_VALIDADO
        - TERCERO
        - NUMERO_EQUIVOCADO
        - SIN_VALIDAR
        - NO_EXISTE

    Perfil:
      type: string
      description: Perfil del agente que atendió la llamada; lo define el tipo de campaña en back-discador.
      enum: [validador, seguimiento, negociador]

    MotivoNoLlamable:
      type: string
      description: Por qué el agente no debe llamar al cliente (regla de negocio, no del prompt).
      enum: [FALLECIDO, SIN_DEUDA_VIGENTE, NEGOCIACION_VIGENTE]

    ClienteResumen:
      type: object
      required: [documento, nombre, llamable]
      properties:
        documento: { type: string }
        nombre: { type: string, description: Nombres y apellidos (razón social en personas jurídicas). }
        nombres: { type: [string, 'null'] }
        apellidos: { type: [string, 'null'] }
        llamable:
          type: boolean
          description: "false si está fallecido, no tiene deuda vigente o tiene una negociación vigente."
        motivoNoLlamable:
          oneOf:
            - $ref: '#/components/schemas/MotivoNoLlamable'
            - type: 'null'
          description: Presente solo cuando llamable es false.

    VerificarRequest:
      type: object
      required: [documento]
      description: |
        Vía principal: `confirmaIdentidad` (el interlocutor dijo "sí, soy yo" / "sí, él habla") junto con
        `digitosDocumento` (los primeros `COBRANZA_DIGITOS_DOCUMENTO` dígitos, 4 por defecto). Ambos son
        necesarios: la confirmación verbal sola no valida. `anioNacimiento` se conserva por compatibilidad.
      properties:
        documento: { type: string }
        confirmaIdentidad: { type: boolean, description: El interlocutor confirmó ser el titular. }
        digitosDocumento: { type: string, example: '4587', description: Primeros dígitos del documento dichos por el cliente. }
        anioNacimiento: { type: integer, example: 1985, deprecated: true }
        callId: { type: string, description: Clave del contador de intentos. Si falta, se usa el documento. }

    VerificarResponse:
      type: object
      required: [verificado, intentosRestantes, mensaje]
      properties:
        verificado: { type: boolean }
        nombre: { type: [string, 'null'], description: Nombres del cliente solo si se validó. }
        intentosRestantes: { type: integer }
        mensaje: { type: string }

    TipoCampana:
      type: string
      description: "Tipo de campaña de CobraTwo: cobranza general (TIP_CAMP_COBGEN) o digital (TIP_CAMP_COBDIG). `OTRO` si el id no está en el catálogo configurado."
      enum: [COBRANZA_GENERAL, COBRANZA_DIGITAL, OTRO]

    TipoDescuento:
      type: string
      description: "Cómo define CobraTwo el descuento: `FORMULA` (TIP_DES_FRM), `FIJO` (TIP_DES_FIJ, monto fijo a pagar) o `LIBRE` (TIP_DES_LBR). `OTRO` si el id no está en el catálogo configurado."
      enum: [FORMULA, FIJO, LIBRE, OTRO]

    DescuentoCampana:
      type: object
      required: [descuentoId, tipo]
      properties:
        descuentoId: { type: integer }
        tipo: { $ref: '#/components/schemas/TipoDescuento' }
        cuotasMaximas: { type: [integer, 'null'], description: Número máximo de cuotas que admite la campaña. }
        formula: { type: [string, 'null'], example: '(fSaldoCapital*(1-0.45))', description: Fórmula de CobraTwo, sin evaluar. }
        factor: { type: [number, 'null'], format: decimal, example: 0.45, description: Factor de la fórmula (0.45 = 45%). }
        montoFijo: { type: [number, 'null'], format: decimal, example: 720.00, description: Monto a pagar cuando el tipo es `FIJO`. }

    OfertaCampana:
      type: object
      required: [moneda, deudaActual, capitalActual, interesTotal]
      description: Saldos de la deuda y oferta de la campaña, calculados en el servidor. Montos en la moneda de la deuda.
      properties:
        moneda: { type: string, enum: [SOLES, DOLARES, OTRA] }
        deudaActual: { type: number, format: decimal, description: Deuda inicial + interés legal − pagos (`fTotalDeuda`). }
        capitalActual: { type: number, format: decimal, description: Capital inicial menos lo pagado por encima de los intereses (`fSaldoCapital`). }
        interesTotal: { type: number, format: decimal, description: Interés inicial + moratorio + compensatorio (`fTotalIntereses`). }
        montoPreaprobado: { type: [number, 'null'], format: decimal, example: 1622.50, description: Monto a pagar según la fórmula de la campaña; null si la fórmula no se pudo evaluar. }
        porcentajeDescuento: { type: [number, 'null'], format: decimal, example: 45.00, description: 'Porcentaje de descuento de la campaña; null en las de monto fijo y en las de factor 1.00 ("sin campaña"), donde solo vale el monto.' }
        cuotas: { type: [integer, 'null'], description: Cuotas de la campaña. }
        cuotaMensual: { type: [number, 'null'], format: decimal, description: Monto preaprobado entre las cuotas. }

    CampanaDeuda:
      type: object
      required: [deudaId, prioridad, campanaId, nombre, tipo, oferta]
      properties:
        deudaId: { type: integer, format: int64, description: Id de la deuda en CobraTwo (TM15NDEUID). }
        operacion: { type: [integer, 'null'], format: int64, description: Número de operación de la deuda. }
        entidad: { type: [string, 'null'], description: Entidad de origen de la deuda (COBTM01). }
        cartera: { type: [string, 'null'], description: Cartera a la que pertenece la deuda (COBTM07). }
        prioridad: { type: integer }
        campanaId: { type: integer }
        nombre: { type: string }
        descripcion: { type: [string, 'null'] }
        tipo: { $ref: '#/components/schemas/TipoCampana' }
        vigenteDesde: { type: [string, 'null'], format: date, description: Informativa; no filtra. }
        vigenteHasta: { type: [string, 'null'], format: date, description: Informativa; no filtra. null cuando la campaña no tiene fecha de fin. }
        descuento:
          oneOf:
            - $ref: '#/components/schemas/DescuentoCampana'
            - type: 'null'
        oferta: { $ref: '#/components/schemas/OfertaCampana' }

    Deuda:
      type: object
      required: [deudaId, producto, entidadOrigen, saldoTotal, diasMora, estado]
      properties:
        deudaId: { type: integer, format: int64 }
        producto: { type: string }
        entidadOrigen: { type: string }
        saldoTotal: { type: number, format: decimal, example: 4850.00 }
        diasMora: { type: integer }
        estado:
          type: string
          enum: [VIGENTE, CON_PROMESA, PAGADA]

    CalcularOfertaRequest:
      type: object
      required: [documento, deudaId, cuotas]
      properties:
        documento: { type: string }
        deudaId: { type: integer, format: int64 }
        cuotas: { type: integer, minimum: 1, description: Debe ser una de las opciones de la política (1, 3, 6, 12 por defecto). }

    Oferta:
      type: object
      required: [deudaId, saldoTotal, cuotas, porcentajeDescuento, montoConDescuento, montoCuota, vigenteHasta]
      properties:
        deudaId: { type: integer, format: int64 }
        saldoTotal: { type: number, format: decimal }
        cuotas: { type: integer }
        porcentajeDescuento: { type: integer }
        montoConDescuento: { type: number, format: decimal }
        montoCuota: { type: number, format: decimal }
        vigenteHasta: { type: string, format: date }

    PromesaRequest:
      type: object
      required: [documento, deudaId, cuotas, fechaPrimerPago]
      properties:
        documento: { type: string }
        deudaId: { type: integer, format: int64 }
        cuotas: { type: integer, minimum: 1 }
        fechaPrimerPago: { type: string, format: date, description: Entre hoy y el plazo máximo de la política. }
        callId: { type: string }

    PromesaResponse:
      type: object
      required: [promesaId, cuotas, montoTotal, montoCuota, fechaPrimerPago, mensaje]
      properties:
        promesaId: { type: integer, format: int64 }
        cuotas: { type: integer }
        montoTotal: { type: number, format: decimal }
        montoCuota: { type: number, format: decimal }
        fechaPrimerPago: { type: string, format: date }
        mensaje: { type: string }

    RellamadaRequest:
      type: object
      required: [documento, fechaHora]
      properties:
        documento: { type: string }
        fechaHora: { type: string, format: date-time, description: Fecha y hora local futura, sin zona (`2026-10-15T15:00:00`). }
        motivo: { type: string }
        callId: { type: string }

    RellamadaAgendadaResponse:
      type: object
      required: [rellamadaId, fechaHora, mensaje]
      properties:
        rellamadaId: { type: integer, format: int64 }
        fechaHora: { type: string, description: La fecha recibida, en formato ISO local. }
        mensaje: { type: string }

    Rellamada:
      type: object
      required: [rellamadaId, documento, fechaHora, estado, creadaEn]
      properties:
        rellamadaId: { type: integer, format: int64 }
        documento: { type: string }
        fechaHora: { type: string, format: date-time }
        motivo: { type: [string, 'null'] }
        callId: { type: [string, 'null'] }
        estado:
          type: string
          enum: [PENDIENTE, PROGRAMADA]
          description: '`PENDIENTE` hasta que el discador la tome. `PROGRAMADA` se reserva para un endpoint aditivo futuro.'
        creadaEn: { type: string, format: date-time }

    IniciarLlamadaRequest:
      type: object
      required: [callId, documento, telefono, perfil]
      properties:
        callId: { type: string, maxLength: 64, description: '`uuid_llamada` del discador.' }
        documento: { type: string, maxLength: 15 }
        telefono: { type: string, maxLength: 20, description: Número marcado, con código de país si lo envía el discador. }
        perfil: { $ref: '#/components/schemas/Perfil' }
        campana: { type: string, maxLength: 100, description: Identificador o nombre de la campaña del discador. }
        guionHash: { type: string, maxLength: 64, description: Hash (SHA-256 hex) del guion interpretado por el agente. }

    LlamadaIniciadaResponse:
      type: object
      required: [llamadaId, callId, inicio, mensaje]
      properties:
        llamadaId: { type: integer, format: int64 }
        callId: { type: string }
        inicio: { type: string, format: date-time }
        mensaje: { type: string }

    EventoLlamadaRequest:
      type: object
      required: [herramienta]
      properties:
        herramienta: { type: string, maxLength: 100, description: Nombre de la herramienta ejecutada por el agente. }
        argumentos:
          type: [object, 'null']
          additionalProperties: true
          description: Argumentos con los que se invocó, tal como los recibió la herramienta.
        respuesta:
          description: Respuesta devuelta por la herramienta. Cualquier valor JSON.
        timestamp: { type: string, format: date-time, description: Momento de la ejecución. Por defecto, la hora del servidor. }

    EventoRegistradoResponse:
      type: object
      required: [eventoId, mensaje]
      properties:
        eventoId: { type: integer, format: int64 }
        mensaje: { type: string }

    EventoLlamada:
      type: object
      required: [eventoId, herramienta, timestamp]
      properties:
        eventoId: { type: integer, format: int64 }
        herramienta: { type: string }
        argumentos:
          type: [object, 'null']
          additionalProperties: true
        respuesta:
          description: Cualquier valor JSON o `null`.
        timestamp: { type: string, format: date-time }

    ResultadoLlamadaRequest:
      type: object
      required: [tipificacion]
      properties:
        documento: { type: string }
        tipificacion: { $ref: '#/components/schemas/Tipificacion' }
        resumen: { type: string, maxLength: 2000, description: Resumen breve en lenguaje natural. }
        guionHash: { type: string, maxLength: 64, description: Aditivo. Hash del guion interpretado. }
        transcripcion: { type: string, description: Aditivo. Transcripción completa de la conversación. }
        resumenEstructurado:
          type: [object, 'null']
          additionalProperties: true
          description: Aditivo. Resumen estructurado que define cada perfil del agente.

    ResultadoRegistradoResponse:
      type: object
      required: [resultadoId, mensaje]
      properties:
        resultadoId: { type: integer, format: int64 }
        mensaje: { type: string }

    ResultadoLlamada:
      type: object
      required: [resultadoId, tipificacion, registradoEn]
      properties:
        resultadoId: { type: integer, format: int64 }
        tipificacion: { $ref: '#/components/schemas/Tipificacion' }
        resumen: { type: [string, 'null'] }
        guionHash: { type: [string, 'null'] }
        resumenEstructurado:
          type: [object, 'null']
          additionalProperties: true
        transcripcion: { type: [string, 'null'] }
        registradoEn: { type: string, format: date-time }

    LlamadaDetalle:
      type: object
      required: [llamadaId, callId, documento, telefono, perfil, inicio, eventos]
      properties:
        llamadaId: { type: integer, format: int64 }
        callId: { type: string }
        documento: { type: string }
        telefono: { type: string }
        perfil: { $ref: '#/components/schemas/Perfil' }
        campana: { type: [string, 'null'] }
        guionHash: { type: [string, 'null'] }
        inicio: { type: string, format: date-time }
        fin: { type: [string, 'null'], format: date-time, description: Se fija al registrar el resultado. }
        resultado:
          oneOf:
            - $ref: '#/components/schemas/ResultadoLlamada'
            - type: 'null'
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/EventoLlamada'

    ValidacionTelefonoRequest:
      type: object
      required: [documento, telefono, resultado, callId]
      description: |
        Se registra en la tabla `AGENTEIATT01` (`TT_VALIDACION_LLAMADA_IA`) de CNTSEC. `inicioLlamada` es el momento
        en que contestaron y `finLlamada` el momento en que colgaron (hora local, ISO-8601). Si falta `inicioLlamada`
        se usa la hora del servidor; la duración se calcula entre ambos salvo que se envíe `duracionSegundos`.
      properties:
        documento: { type: string, maxLength: 15 }
        telefono: { type: string, maxLength: 20, description: Número marcado, tal como vino en la lista del discador. }
        resultado: { $ref: '#/components/schemas/ResultadoValidacionTelefono' }
        callId: { type: string, maxLength: 64, description: Único por llamada; repetirlo responde 409. }
        inicioLlamada: { type: string, format: date-time, example: '2026-10-29T10:15:00' }
        finLlamada: { type: string, format: date-time, example: '2026-10-29T10:17:30' }
        duracionSegundos: { type: integer, minimum: 0, description: Desde que contestó hasta que colgó. Opcional si van las dos fechas. }
        resumen: { type: string, maxLength: 2000, description: Resumen de la llamada generado por el agente. }

    ValidacionRegistradaResponse:
      type: object
      required: [validacionId, resultado, mensaje, esCliente]
      properties:
        validacionId: { type: integer, format: int64, description: Id en AGENTEIATT01. }
        resultado: { $ref: '#/components/schemas/ResultadoValidacionTelefono' }
        mensaje: { type: string }
        esCliente: { type: boolean, description: true solo con CONTACTO_VALIDADO. }
        duracionSegundos: { type: [integer, 'null'] }

    ArchivosConfiguracion:
      type: object
      description: |
        Mapa `nombreArchivo -> contenido` (texto UTF-8). Nombres permitidos: `prompt.md`, `guion.json`,
        `config.yaml`, `global.yaml`. Máximo 256 KB por archivo.
      minProperties: 1
      propertyNames:
        enum: [prompt.md, guion.json, config.yaml, global.yaml]
      additionalProperties:
        type: string
        maxLength: 262144
      example:
        prompt.md: "Eres Lucía, asesora de Finanty...\n"
        config.yaml: "llm:\n  modelo: gpt-4.1-mini\n"

    AmbitoConfiguracion:
      type: object
      required: [ambito, versionVigente, hayBorrador, publicadoEn]
      properties:
        ambito: { type: string }
        versionVigente: { type: [integer, 'null'], description: Número de la versión publicada (la mayor); null si nunca se publicó. }
        hayBorrador: { type: boolean }
        publicadoEn: { type: [string, 'null'], format: date-time, description: Fecha de la versión vigente. }

    VersionConfiguracionResumen:
      type: object
      required: [numero, autor, comentario, fecha]
      properties:
        numero: { type: integer, minimum: 1 }
        autor: { type: string }
        comentario: { type: [string, 'null'], description: null cuando no se envió al publicar o guardar. }
        fecha: { type: string, format: date-time }

    VersionConfiguracion:
      type: object
      required: [ambito, numero, autor, comentario, fecha, archivos]
      properties:
        ambito: { type: string }
        numero: { type: integer, minimum: 1 }
        autor: { type: string }
        comentario: { type: [string, 'null'], description: null cuando no se envió al publicar o guardar. }
        fecha: { type: string, format: date-time }
        archivos: { $ref: '#/components/schemas/ArchivosConfiguracion' }

    PublicarConfiguracionRequest:
      type: object
      required: [archivos, autor]
      properties:
        archivos: { $ref: '#/components/schemas/ArchivosConfiguracion' }
        autor: { type: string, maxLength: 100, description: Quién publica (usuario de la consola). }
        comentario: { type: string, maxLength: 500, description: Opcional. Qué cambió en esta versión; si no se envía, la versión queda con comentario null. }

    ConfiguracionPublicadaResponse:
      type: object
      required: [ambito, numero, fecha]
      properties:
        ambito: { type: string }
        numero: { type: integer, minimum: 1, description: Número asignado a la versión nueva. }
        fecha: { type: string, format: date-time }

    BorradorConfiguracion:
      type: object
      required: [ambito, autor, comentario, fecha, archivos]
      properties:
        ambito: { type: string }
        autor: { type: string }
        comentario: { type: [string, 'null'], description: null cuando no se envió al publicar o guardar. }
        fecha: { type: string, format: date-time, description: Último guardado. }
        archivos: { $ref: '#/components/schemas/ArchivosConfiguracion' }

    GuardarBorradorRequest:
      type: object
      required: [archivos, autor]
      properties:
        archivos: { $ref: '#/components/schemas/ArchivosConfiguracion' }
        autor: { type: string, maxLength: 100 }
        comentario: { type: string, maxLength: 500, description: Opcional; si no se envía queda null. }

    BorradorGuardadoResponse:
      type: object
      required: [ambito, fecha]
      properties:
        ambito: { type: string }
        fecha: { type: string, format: date-time }
